<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลิงก์หมดอายุ | สสน.</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('webpage', path='/index.css') }}">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="thumbnail-ci-Photoroom.png" alt="สถาบันสารสนเทศทรัพยากรน้ำ">
        </div>
        
        
        <h1>ลิงก์เปลี่ยนรหัสผ่านหมดอายุ</h1>
        
        <div class="status-badge">หมดอายุแล้ว</div>
        
        <p class="message">
            ขออภัย ลิงก์สำหรับเปลี่ยนรหัสผ่านนี้<br>
            ได้หมดอายุแล้ว
        </p>
        
        <div class="thank-you">
            <h2>🔒 ต้องการเปลี่ยนรหัสผ่าน?</h2>
            <p>กรุณาขอลิงก์เปลี่ยนรหัสผ่านใหม่อีกครั้ง<br>หรือติดต่อผู้ดูแลระบบ</p>
        </div>
        
        <div class="divider"></div>
        
        <div class="footer">
            <p class="org-name">สถาบันสารสนเทศทรัพยากรน้ำ (องค์การมหาชน)</p>
            <p>หากมีข้อสงสัย กรุณาติดต่อผู้ดูแลระบบ</p>
        </div>
    </div>

    <script src="Changepwd.js"></script>
