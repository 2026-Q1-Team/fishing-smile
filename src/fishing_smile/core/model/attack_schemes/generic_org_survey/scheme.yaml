name: generic_org_survey
description: >-
  Trick victim into providing private information (home address, national id, etc.)
  by impersonating a organization-wide survey regarding mundane topics.
components:
- kind: email
  name: benefits_survey_email
  templates:
    url: >- 
      {{ settings.cast.url }}/benefits_survey?k={{ attack.external_id }}
    subject: >-
      {{ attack.target.company }} Yearly Benefits Survey.
    body:
      kind: file
      path: survey_email_body.txt.jinja
      mime: text/plain
    
- kind: web
  name: survey_page
  templates:
    html:
      kind: file
      path: survey_page.html.jinja
      mime: text/html
    url: /benefits_survey
    method: GET
    eventkind: Email.sent, Link.clicked
    eventdetail: ip