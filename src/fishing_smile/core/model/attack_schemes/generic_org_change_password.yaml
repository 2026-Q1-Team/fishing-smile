name: generic_org_change_password
description: >-
  Trick victim into giving up their password by pretending to be
  IT department of target's organization prompting for a regular password change.
components:
- kind: email
  name: bait_email
  red_flags:
  - kind: urgency
    name: กำหนดเวลาเร่งด่วน
    explanation: อีเมลบอกให้เปลี่ยนรหัสผ่านก่อนวันที่กำหนด เพื่อกดดันให้รีบดำเนินการโดยไม่ทันคิด
  - kind: suspicious_link
    name: ลิงก์ URL ไม่ตรงกับเว็บจริงขององค์กร
    explanation: ลิงก์ในอีเมลชี้ไปยังเว็บไซต์ที่ไม่ใช่ระบบจริงขององค์กร ควรตรวจสอบ URL ก่อนคลิกเสมอ
  - kind: password_request
    name: ขอรหัสผ่านปัจจุบันผ่านเว็บ
    explanation: ระบบเปลี่ยนรหัสผ่านจริงไม่เคยขอรหัสผ่านเดิมผ่านหน้าเว็บภายนอก
  - kind: no_2fa
    name: ไม่มีการยืนยันตัวตนเพิ่มเติม
    explanation: ระบบจริงมักจะมี 2FA หรือ OTP ยืนยันตัวตนก่อนเปลี่ยนรหัสผ่าน
  - kind: mismatched_sender
    name: ชื่อผู้ส่งกับอีเมลไม่ตรงกัน
    explanation: >-
      อีเมลแสดงชื่อผู้ส่งว่า ICT Team แต่ที่อยู่อีเมลจริงอาจไม่ตรงกับโดเมนขององค์กร
      ควรตรวจสอบที่อยู่อีเมลผู้ส่งเสมอ ไม่ใช่แค่ชื่อที่แสดง
  templates:
    url: >-
      {{ settings.cast.url }}/index.html?k={{ attack.external_id }}
    subject: >-
      Please change your {{ attack.target.company }} account password.
    body: |
      Dear {{ attack.target.name }},
      
      According to our new security policy, all {{ attack.target.company }} staff must change their password every 6 months.
      Follow these steps below to change your {{ attack.target.company }} account password.
          Step 1. Go to this page [1].
          Step 2. Enter your old password.
          Step 3. Enter your new password.
          Step 4. Confirm your new password.
          Step 5. Click "Submit".
      
      Please be reminded that all staff must change their password before 28 Jan 2026. If your password is already expired please contact ICT support team.
      *You will be automatically logged out of your account on all devices after this process.
      **If you are not logged out automatically, please manually log out to allow the process to complete.
      
      Thank you for taking your time to keep our organization secure.
      - ICT Team.
      
      [1] {{ templates.url }}
- kind: html
  name: form_page
  url:
  html_template: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>การฝึกอบรม Anti-Phishing | สสน.</title>
        <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/webpage/Changepwd.css">
        <style>
            .alert-badge {
                display: inline-block;
                background: #f59e0b;
                color: white;
                padding: 0.4rem 1.2rem;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 500;
                margin-bottom: 1.5rem;
            }
            .red-flags {
                background: #fff3e0;
                border-radius: 12px;
                padding: 1.2rem 1.5rem;
                margin-bottom: 1.5rem;
                text-align: left;
            }
            .red-flags h2 {
                color: #e65100;
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 0.8rem;
            }
            .red-flag-item {
                margin-bottom: 0.8rem;
                padding-left: 0.5rem;
            }
            .red-flag-item strong {
                color: #d84315;
                display: block;
                font-size: 0.95rem;
            }
            .red-flag-item p {
                color: #6d4c41;
                font-size: 0.85rem;
                margin-top: 0.2rem;
            }
            .scheme-info {
                background: #e8f4fc;
                border-radius: 12px;
                padding: 1.2rem;
                margin-bottom: 1.5rem;
            }
            .scheme-info h2 {
                color: #1a73a7;
                font-size: 1.1rem;
                font-weight: 500;
                margin-bottom: 0.5rem;
            }
            .scheme-info p {
                color: #5a7a8a;
                font-size: 0.9rem;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="logo">
                <img src="/webpage/thumbnail-ci-Photoroom.png" alt="สถาบันสารสนเทศทรัพยากรน้ำ">
            </div>

            <h1>นี่คือการฝึกอบรม Anti-Phishing</h1>

            <div class="alert-badge">การทดสอบ Phishing</div>

            <p class="message">
                อีเมลที่คุณได้รับเป็น <strong>อีเมลจำลอง</strong> จากทีม ICT<br>
                เพื่อฝึกอบรมการรับมือกับ Phishing Attack
            </p>

            <div class="scheme-info">
                <h2>{{ scheme_name }}</h2>
                <p>{{ description }}</p>
            </div>

            {% if red_flags %}
            <div class="red-flags">
                <h2>สัญญาณเตือน (Red Flags) ที่ควรสังเกต</h2>
                {% for flag in red_flags %}
                <div class="red-flag-item">
                    <strong>{{ flag.name }}</strong>
                    <p>{{ flag.explanation }}</p>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="divider"></div>

            <div class="footer">
                <p class="org-name">สถาบันสารสนเทศทรัพยากรน้ำ (องค์การมหาชน)</p>
                <p>หากมีข้อสงสัย กรุณาติดต่อผู้ดูแลระบบ</p>
            </div>
        </div>
    </body>
    </html>

