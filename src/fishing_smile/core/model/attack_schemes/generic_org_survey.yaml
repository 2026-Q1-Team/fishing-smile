name: generic_org_survey
description: >-
  Trick victim into providing private information (home address, national id, etc.)
  by impersonating a organization-wide survey regarding mundane topics.
components:
- kind: email
  name: fake_survey_email
  templates:
    url: >-
      {{ settings.cast.url }}/index.html?k={{ attack.external_id }}
    subject: >-
      {{ attack.target.company }} Yearly Benefits Survey.
    body: |
      Dear {{ attack.target.name }},
      
      We would like to gather feedback from all members of the {{ attack.target.job_title }} team,
      in order to improve the quality of benefits we provide to our employees.
      
      Please fill out the form below.
      
      {{ templates.url }}
      
      Thank you for taking your time to improve our organization.
      - HR Team.
    alt_body: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ attack.target.company }} Yearly Benefits Survey</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
          }
          .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 1.75rem;
            max-width: 460px;
            width: 100%;
          }
          .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
          }
          .card-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-wrap;
          }
          .card-body a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
          }
        </style>
      </head>
      <body>
        <div class="card">
          <h1 class="card-title">{{ attack.target.company }} Yearly Benefits Survey</h1>
          <div class="card-body">
      Dear {{ attack.target.name }},

      We would like to gather feedback from all members of the {{ attack.target.job_title }} team,
      in order to improve the quality of benefits we provide to our employees.

      Please fill out the form below.

      <a href="{{ templates.url }}">{{ templates.url }}</a>

      Thank you for taking your time to improve our organization.
      - HR Team.
          </div>
        </div>
      </body>
      </html>

- kind: html
  name: form_page
  url:
  html_template:

- kind: api
  name: submit
  url:
