name: generic_org_survey
description: >-
  Trick victim into providing private information (home address, national id, etc.)
  by impersonating a organization-wide survey regarding mundane topics.
components:
- kind: email
  name: fake_survey_email
  templates:
    url: >-
      {{ settings.cast.url }}/index.html?k={{ attack.external_id }}
    subject: >-
      {{ attack.target.company }} Yearly Benefits Survey.
    body: |
      Dear {{ attack.target.name }},
      
      We would like to gather feedback from all members of the {{ attack.target.job_title }} team,
      in order to improve the quality of benefits we provide to our employees.
      
      Please fill out the form below.
      
      {{ templates.url }}
      
      Thank you for taking your time to improve our organization.
      - HR Team.
    alt_body: >-
      <!DOCTYPE html>
      <head>
      <main>
      <p>Cool text here.</p>
      <a href="{{ templates.url }}">Click here.</a>
      </main>
      </head>

- kind: html
  name: form_page
  url:
  html_template:

- kind: api
  name: submit
  url:
