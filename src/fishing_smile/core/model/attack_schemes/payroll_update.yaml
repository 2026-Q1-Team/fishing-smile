name: payroll_update
description: >-
  Impersonates the Accounting department claiming there's an error in the employee's bank details.
  Used to steal corporate portal credentials.
components:
- kind: email
  name: payroll_email
  email_template: payroll_notification
  template:
    url: "{{ settings.cast.url }}/payroll-update?k={{ attack.external_id }}"
    subject: "Payroll Discrepancy Found - Action Required"
    body: | 
      Dear {{ attack.target.name }},

      We encountered an issue with your payroll verification for {{ attack.target.company }}. To avoid 
      any delay in your monthly payment, please confirm your bank details at the link below by EOD:

      Update here: <a href="{{ url }}">{{ settings.cast.url }}/payroll-update</a>

      Sincerely,
      Payroll Department
      {{ attack.target.company }}
  red_flags:
  - kind: financial_threat
    name: payment_delay
    explanation: "Leveraging payroll delays to create a sense of urgency and financial insecurity"

- kind: html
  name: payroll_update_page
  url: payroll-update
  html_template: |
    <html>
    <head>
      <title>Payroll Update</title>
    </head>
    <body>
      <h1>Payroll Update</h1>
      <p>Please update your bank details to avoid any delay in your monthly payment.</p>
      <form>
        <input type="text" placeholder="Bank Name">
        <input type="text" placeholder="Account Number">
        <button type="submit">Update</button>
      </form>
    </body>
    </html>

      
