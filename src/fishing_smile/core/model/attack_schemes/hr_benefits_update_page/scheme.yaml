name: hr_benefits_update_page
description: >-
  Impersonate the HR department to trick employees into providing their
  internal credentials by claiming there is an update to employee benefits.
components:
- kind: email
  name: hr_benefits_email
  templates:
    url: >-
      {{ settings.cast.url }}/hr_benefits?k={{ attack.external_id }}
    subject: >-
      [NEW] Employee Benefits and Bonus Structure Update 2026
    body:
      kind: file
      path: hr_benefits_email_body.txt.jinja
      mime: text/plain
    alt_body:
      kind: file
      path: hr_benefits_email_alt_body.html.jinja
      mime: text/html
- kind: web
  name: hr_benefits_page
  templates:
    html:
      kind: file
      path: hr_benefits_update_page.html.jinja
      mime: text/html
    url: /hr_benefits