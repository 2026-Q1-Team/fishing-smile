name: payroll_update
description: >-
  Impersonates the Accounting department claiming there's an error in the employee's bank details.
  Used to steal corporate portal credentials.
components:
- kind: email
  name: payroll_email
  templates:
    url: >-
      {{ settings.cast.url }}/payroll_update?k={{ attack.external_id }}
    subject: >-
      Payroll Discrepancy Found - Action Required
    body:
      kind: file
      path: payroll_email_body.txt.jinja
- kind: web
  name: payroll_update_page
  templates:
    html:
      kind: file
      path: payroll_update_page.html.jinja
      mime: text/html
    url: /payroll_update
    method: GET
    eventkind: Email.sent, Link.clicked
    eventdetail: ip
    