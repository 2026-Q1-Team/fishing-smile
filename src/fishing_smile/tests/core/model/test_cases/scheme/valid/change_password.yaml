name: change_password
description: >-
  Trick victim into giving their password for an external service
  to attacker's look-alike change password page.
components:
- kind: email
  name: bait_email
  # TODO: Python string template likely will not be able to
  # express "finding components with specific ID in a list".
  # Try other template engine like jinja. Or, ...
  email_template: |
    Dear {{ attack.target.name }},

    Please change your password by visiting
    {{ attack.scheme.components.first(kind = 'html').url }}
  red_flags:
  # TODO: not sure if we need both `kind` and `name` fields
  - kind: look_alike_domain
    name: look_alike_domain
    explanation: >-
      Link to change password lead to look-alike domain instead.
- kind: html
  name: change_password_html
  templates:
    url: >-
      {{ settings.cast.url }}/change_password
    html: |
      <html>
      <body>
        <form id="changePasswordForm">
          <input type="password" id="newPassword" placeholder="กรอกรหัสผ่านเดิม" required>
          <button
            type="submit" id="submitBtn" method="post"
            action="{{ attack.scheme.components.first(kind = 'api').url }}"
          >เปลี่ยนรหัสผ่าน</button>
        </form>
      </body>
      </html>
- kind: api
  name: change_password_api
  templates:
    url: >-
      {{ settings.cast.url }}/api/change_password
