<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Mail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fishing.smile</h1>
        <p>Your traffic has been logged. Have a nice day!</p>
    </div>

    <script>
        // get tracking key from url
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('k');

        // if key exist, use in tracking.php
        if (userKey) {
            fetch('tracking.php?k=' + userKey)
                .then(response => console.log("Logged"))
                .catch(error => console.error("Error logging"));
        }
    </script>
</body>
</html>
