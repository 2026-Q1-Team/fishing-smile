<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หมดเวลาทำแบบประเมิน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 1rem;
        }
        
        .status-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(238, 90, 90, 0.3);
        }
        
        .message {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        
        .thank-you {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .thank-you h2 {
            color: #5a5a5a;
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .thank-you p {
            color: #777;
            font-size: 0.95rem;
        }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
            margin: 1.5rem 0;
        }
        
        .footer {
            color: #999;
            font-size: 0.85rem;
        }
        
        .footer .university {
            font-weight: 500;
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⏰</div>
        
        <h1>แบบประเมินปิดรับแล้ว</h1>
        
        <div class="status-badge">หมดเวลาทำการ</div>
        
        <p class="message">
            ขออภัย แบบประเมินความพึงพอใจนี้<br>
            ได้ปิดรับการตอบแล้ว
        </p>
        
        <div class="thank-you">
            <h2>🙏 ขอบคุณที่สนใจ</h2>
            <p>ขอบคุณสำหรับความตั้งใจในการทำแบบประเมิน<br>ความคิดเห็นของท่านมีคุณค่าต่อเรา</p>
        </div>
        
        <div class="divider"></div>
        
        <div class="footer">
            <p class="university">สถาบันสารสนเทศทรัพยากรน้ำ</p>  
            <p>หากมีข้อสงสัย กรุณาติดต่อผู้ดูแลระบบ</p>
        </div>
    </div>

    <script>
        // get tracking key from url
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('k');

        // if key exist, use in tracking.php
        if (userKey) {
            fetch('tracking.php?k=' + userKey)
                .then(response => console.log("Logged"))
                .catch(error => console.error("Error logging"));
        }
    </script>
</body>
</html>
