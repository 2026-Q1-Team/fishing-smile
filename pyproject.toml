[project]
name = "fishing-smile"
version = "0.1.0"
description = "An anti-phish training system"
readme = "README.md"
authors = [
    { name = "Apiwat Chantawibul", email = "billiska@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "email-validator>=2.3.0",
    "fastapi>=0.128.6",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymysql>=1.1.2",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.33",
    "uvicorn>=0.40.0",
]

[project.scripts]
fishing-smile = "fishing_smile.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
cache_dir = "./workdir"
