[project]
name = "fishing-smile"
version = "0.1.0"
description = "An anti-phish training system"
readme = "README.md"
authors = [
    { name = "Apiwat Chantawibul", email = "billiska@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "pymysql>=1.1.2",
]

[project.scripts]
cast-net = "fishing_smile.cast_net:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
