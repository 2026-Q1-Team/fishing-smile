name: local-test-fish
services:
  db:
    image: mysql:9
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_USER: root
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_DATABASE: fishtrack
      MYSQL_USER: fish_app
      MYSQL_PASSWORD: db_password_for_local_test
    volumes:
    - type: volume
      source: mysql
      target: /var/lib/mysql
    - type: bind
      source: ../../src/database/fishtrack.sql
      target: /opt/fish/fishtrack.sql
      read_only: true
    command:
    - mysqld
    - --init-file
    - /opt/fish/fishtrack.sql
    ports:
    - 3306:3306
    healthcheck:
      test:
      - CMD
      - mysqlsh
      - --user=fish_app
      - --password=db_password_for_local_test
      - --database=fishtrack
      - '--execute=DESCRIBE fishlist;'
      interval: 1s
      timeout: 15s
      retries: 10
  pma:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
    - 8091:80
    links:
    - db
  cli:
    image: fishing-smile
    pull_policy: never
    build:
      context: ../..
    env_file:
    - env/database.env
    environment:
    - UV_CACHE_DIR=/opt/app/workdir/.cache/uv
    entrypoint:
    - sh
    volumes:
      # Mount python source code for live editing during development
      - ../../src:/opt/app/src
      # Mount uv-managed files for dependency updates using
      # `uv add --no-sync PACKAGE` or `uv lock`
      - ../../pyproject.toml:/opt/app/pyproject.toml
      - ../../uv.lock:/opt/app/uv.lock
    depends_on:
      db:
        condition: service_healthy
    profiles:
    - cli

volumes:
  mysql:
